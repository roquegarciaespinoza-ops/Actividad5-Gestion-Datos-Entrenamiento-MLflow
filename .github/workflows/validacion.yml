name: Validación básica
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias de pruebas
        run: python -m pip install 'numpy>=2.1,<3' 'scikit-learn>=1.6,<2' 'Pillow>=11,<13' 'pytest>=8,<10'
      - name: Comprobar sintaxis
        run: python -m compileall -q fuentes tests
      - name: Ejecutar pruebas sin datos sensibles
        run: python -m pytest -q tests
